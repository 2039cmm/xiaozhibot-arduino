; PlatformIO Project Configuration File
; ESP-SparkBot (ESP32-S3 + ST7789 240x240) - Arduino 最小点屏工程
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; SparkBot 用的是 16MB Flash + 8MB Octal PSRAM，点屏本身用不到 PSRAM，
; 但保持与实际硬件一致，后面上 LVGL 时把整屏 buffer 放 PSRAM 即可。
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

lib_deps =
    ; 1.6.x 需要 arduino-esp32 3.x 内核；PlatformIO espressif32 6.9.0 用的是 2.0.17，故钉 1.4.9
    moononournation/GFX Library for Arduino @ 1.4.9
