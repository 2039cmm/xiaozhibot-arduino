; PlatformIO Project Configuration File
; ESP-SparkBot (ESP32-S3 + ST7789 240x240) - Arduino 最小点屏工程
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; SparkBot 用的是 16MB Flash + 8MB Octal PSRAM，点屏本身用不到 PSRAM，
; 但保持与实际硬件一致，后面上 LVGL 时把整屏 buffer 放 PSRAM 即可。
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; ============================================================
; 【引脚冲突 · 非常重要】
; 本板 LCD 的 DC=GPIO43、CS=GPIO44，正好是 ESP32-S3 的 UART0 TXD/RXD。
; 只要调用 Serial.begin()（默认绑定 UART0），这两根脚就会被 UART
; 外设接管，LCD 的 DC/CS 失效 -> 屏幕全黑，且日志也从这两根线跑掉。
; 解决方式：代码里改用它核心自带的 USBSerial（HWCDC / USB-Serial-JTAG，
; GPIO19/20），不要用 Serial。板级已定义 -DARDUINO_USB_MODE=1，
; 因此 ARDUINO_USB_CDC_ON_BOOT=0 时会自动提供 USBSerial 对象。
; ============================================================

; ============================================================
; LVGL 配置文件位置
; lv_conf_internal.h 默认会去找「lvgl 目录的同级 ../../lv_conf.h」
; （即 .pio/libdeps/<env>/lv_conf.h）。但 .pio 不进版本控制，
; 所以这里显式声明 LV_CONF_INCLUDE_SIMPLE，让 LVGL 直接
; #include "lv_conf.h"，从本工程的 include/ 目录取。
; ============================================================
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    ; 1.6.x 需要 arduino-esp32 3.x 内核；PlatformIO espressif32 6.9.0 用的是 2.0.17，故钉 1.4.9
    moononournation/GFX Library for Arduino @ 1.4.9
    ; 官方 ui/ 由 SquareLine 按 LVGL 8.3.11 生成，版本必须对齐 8.3.x
    lvgl/lvgl @ 8.3.11
